name: plane-graph image
on:
  pull_request:
    paths:
      - 'apps/plane-graph/**'
      - 'packages/plane-app/**'
      - '.github/workflows/plane-graph-image.yml'
  push:
    branches: [main]
    paths:
      - 'apps/plane-graph/**'
      - 'packages/plane-app/**'
      - '.github/workflows/plane-graph-image.yml'
permissions:
  contents: read
  packages: write
env:
  IMAGE: ghcr.io/alxwlw/plane-graph
jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - name: Build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: apps/plane-graph/Dockerfile
          platforms: linux/amd64
          load: true
          tags: plane-graph:smoke
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Smoke
        run: |
          set -euo pipefail
          cp apps/plane-graph/tenants.example.json "$RUNNER_TEMP/tenants.json"
          chmod 644 "$RUNNER_TEMP/tenants.json"
          docker run -d --name pg -p 18080:8080 \
            -v "$RUNNER_TEMP/tenants.json:/config/tenants.json:ro" -v pgsmoke:/data \
            -e PLANE_GRAPH_PLANE_URL=https://plane.example.com \
            -e PLANE_GRAPH_PUBLIC_URL=https://plane-graph.example.com \
            -e PLANE_GRAPH_EX_PLANE_SECRET=x \
            -e PLANE_GRAPH_EX_WEBHOOK_SECRET=x \
            -e PLANE_GRAPH_EX_READ_KEY=read-x \
            -e PLANE_GRAPH_EX_AGENT_KEY=agent-x plane-graph:smoke
          for _ in $(seq 20); do curl -fs localhost:18080/healthz && break; sleep 0.5; done
          curl -fs localhost:18080/healthz | grep -qx ok
          docker exec pg wget -q --spider http://localhost:8080/healthz
          curl -fs localhost:18080/assets/graph.js | grep -q .
          docker logs pg | grep -F '"event":"listening"' | grep -F '"id":"ex"'
          docker exec pg test -f /data/plane-graph.sqlite
          docker rm -f pg
      - name: Log in to ghcr.io
        if: github.event_name == 'push'
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Push
        id: push
        if: github.event_name == 'push'
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: apps/plane-graph/Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ github.sha }}
            ${{ env.IMAGE }}:main
          labels: org.opencontainers.image.source=https://github.com/alxwlw/tools
          cache-from: type=gha
      - name: Digest
        if: github.event_name == 'push'
        run: echo "${IMAGE}@${DIGEST}" >> "$GITHUB_STEP_SUMMARY"
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
