$schema: 'https://moonrepo.dev/schemas/project.json'

language: 'typescript'
layer: 'application'

# Канон смотрит в src/ и tests/; здесь каталог тестов — test/, плюс scripts/ и web/.
fileGroups:
  tests:
    - 'test/**/*'
  sources:
    - 'src/**/*'
    - 'scripts/**/*'
    - 'web/**/*'

# The canon lint targets src only; the appended arg adds scripts/ and web/.
tasks:
  lint:
    args: 'scripts web'
  # The browser code (web/) has its own tsconfig with DOM types, which the root one cannot mix with @types/bun.
  typecheck:
    script: 'bun run --bun $workspaceRoot/node_modules/typescript/bin/tsc --noEmit && bun run --bun $workspaceRoot/node_modules/typescript/bin/tsc --noEmit -p web'
