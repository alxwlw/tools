# Wealthfolio + wf-sync as a Dokploy compose app (source type raw). dokploy-rollout.sh uploads this
# file, the env and config.yaml; Dokploy keeps config.yaml in ../files/, next to this file's code/.
#
# The UI is reachable only from the tailnet, through the `tailscale` service below. It is a tailnet node of its own
# (wealthfolio.<tailnet>.ts.net, tag:apps): its serve terminates HTTPS on 443 and proxies to wealthfolio:8088 by
# service name (DX-196). Nothing is published on the host. wf-sync reaches Wealthfolio at http://wealthfolio:8088
# over the compose network.

x-logging: &logging
  driver: json-file
  options:
    max-size: 50m
    max-file: '3'

configs:
  ts-serve:
    # $$ keeps compose from interpolating it; containerboot replaces ${TS_CERT_DOMAIN} with the node's ts.net name.
    content: |
      {"TCP": {"443": {"HTTPS": true}},
       "Web": {"$${TS_CERT_DOMAIN}:443": {"Handlers": {"/": {"Proxy": "http://wealthfolio:8088"}}}}}

services:
  tailscale:
    image: tailscale/tailscale:v1.104.7@sha256:72c1e19e0aedca96b8533bbb0b4368564410ff20b17e53b804eb6c1f04a31be4
    restart: unless-stopped
    logging: *logging
    environment:
      TS_HOSTNAME: wealthfolio
      # A single-use, pre-approved tag:apps key that dokploy-rollout.sh mints with the OAuth client and that expires
      # in an hour. Not the OAuth secret itself: containerboot passes this value in `tailscale up` argv, which /proc
      # shows to all.
      TS_AUTHKEY: ${TS_AUTHKEY:?dokploy-rollout.sh sets it}
      TS_EXTRA_ARGS: --advertise-tags=tag:apps
      # Log in only while the state volume holds no node: a redeploy keeps the same device and never uses the key.
      TS_AUTH_ONCE: 'true'
      TS_STATE_DIR: /var/lib/tailscale
      TS_SERVE_CONFIG: /config/serve.json
      # Serve only proxies to another container, so neither /dev/net/tun nor NET_ADMIN is needed.
      TS_USERSPACE: 'true'
      TS_ENABLE_HEALTH_CHECK: 'true'
      TS_LOCAL_ADDR_PORT: 127.0.0.1:9002
    configs:
      - source: ts-serve
        target: /config/serve.json
    volumes:
      - tailscale:/var/lib/tailscale
    healthcheck:
      test: ['CMD', 'wget', '-q', '-O', '/dev/null', 'http://127.0.0.1:9002/healthz']
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

  wealthfolio:
    image: wealthfolio/wealthfolio:3.13.1@sha256:a51bf08440ec3c517b728e4d5a7d9134cc564e1749eec45bd4f0b7f39573336e
    restart: unless-stopped
    logging: *logging
    # No published port: only the tailscale service and wf-sync reach it, over the compose network.
    environment:
      WF_LISTEN_ADDR: 0.0.0.0:8088
      WF_DB_PATH: /data/wealthfolio.db
      # Volume backups in Dokploy are plain tar files, so the database encrypts itself with WF_SECRET_KEY.
      # It has to be on from the first start: this flag doesn't convert an existing database.
      WF_DB_REQUIRE_ENCRYPTION: '1'
      WF_SECRET_KEY: ${WF_SECRET_KEY}
      WF_AUTH_PASSWORD_HASH: ${WF_AUTH_PASSWORD_HASH}
      WF_CORS_ALLOW_ORIGINS: ${WF_CORS_ALLOW_ORIGINS}
      TZ: ${TZ:-UTC}
    volumes:
      - wealthfolio-data:/data

  wf-sync:
    image: ghcr.io/alxwlw/wf-sync:main@sha256:8e836d0f04fa4c35534272cb9fe50ba60a4eaaeb4f2dcdc0f46705f0a8964ee5
    restart: unless-stopped
    logging: *logging
    depends_on: [wealthfolio]
    # A list, not env_file: the sync has no use for WF_SECRET_KEY.
    environment:
      WF_PASSWORD: ${WF_PASSWORD}
      BINANCE_API_KEY: ${BINANCE_API_KEY:-}
      BINANCE_SECRET: ${BINANCE_SECRET:-}
      OKX_API_KEY: ${OKX_API_KEY:-}
      OKX_SECRET: ${OKX_SECRET:-}
      OKX_PASSPHRASE: ${OKX_PASSPHRASE:-}
      KRAKEN_API_KEY: ${KRAKEN_API_KEY:-}
      KRAKEN_SECRET: ${KRAKEN_SECRET:-}
      WHITEBIT_API_KEY: ${WHITEBIT_API_KEY:-}
      WHITEBIT_SECRET: ${WHITEBIT_SECRET:-}
      BYBIT_API_KEY: ${BYBIT_API_KEY:-}
      BYBIT_SECRET: ${BYBIT_SECRET:-}
      GATE_API_KEY: ${GATE_API_KEY:-}
      GATE_SECRET: ${GATE_SECRET:-}
      HTX_API_KEY: ${HTX_API_KEY:-}
      HTX_SECRET: ${HTX_SECRET:-}
      ZERION_API_KEY: ${ZERION_API_KEY:-}
      MONOBANK_TOKEN: ${MONOBANK_TOKEN:-}
      TZ: ${TZ:-UTC}
    volumes:
      - ../files/config.yaml:/app/config.yaml:ro
      - wf-sync-data:/app/data

volumes:
  wealthfolio-data:
  wf-sync-data:
  # The node's identity: lose it and the next start registers a new device (wealthfolio-1).
  tailscale:
