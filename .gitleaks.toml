# Repo-local gitleaks config — YOURS to edit (seeded once by `stack sync`,
# never overwritten). The canon ruleset lives in .gitleaks.canon.toml, which IS
# sync-managed verbatim — never edit that file; put repo-specific allowlists
# and extra rules HERE instead. gitleaks chains configs via [extend]:
# default ruleset → .gitleaks.canon.toml → this file.
[extend]
path = ".gitleaks.canon.toml"

# Fake incident key used as a literal in two test files (not a credential).
# Both conditions must hold, so the generic-api-key rule stays on everywhere else.
[[allowlists]]
description = "fake test incident key in plane-hooks tests"
condition = "AND"
paths = [
  '''apps/plane-hooks/test/grafana\.test\.ts''',
  '''apps/plane-hooks/test/server\.test\.ts''',
]
regexes = ['''a1b2c3d4e5f60718''']

# Fake Discord application id in the plane-discord image smoke run and tests
# (discord-client-id rule). Path AND exact value, as above.
[[allowlists]]
description = "fake Discord application id in plane-discord workflow and tests"
condition = "AND"
paths = [
  '''\.github/workflows/plane-discord-image\.yml''',
  '''apps/plane-discord/test/index\.test\.ts''',
  '''apps/plane-discord/test/index-process\.test\.ts''',
  '''apps/plane-discord/test/index-world\.ts''',
]
regexes = ['''^123456789012345678$''']

# Fake bot token of the fake Gateway (generic-api-key rule). gateway.test.ts
# held it before the harness was split out; the path stays for history scans.
[[allowlists]]
description = "fake bot token in plane-discord gateway tests"
condition = "AND"
paths = [
  '''apps/plane-discord/test/gateway-harness\.ts''',
  '''apps/plane-discord/test/gateway\.test\.ts''',
]
regexes = ['''^tok-SECRET-9f3a$''']

# The list of required env names in plane-discord's config: the
# discord-client-secret rule reads the next name as a secret.
[[allowlists]]
description = "env name list in plane-discord config"
condition = "AND"
paths = ['''apps/plane-discord/src/config\.ts''']
regexes = ['''^PLANE_DISCORD_DISCORD_PUBLIC_KEY$''']

# Fake OAuth access tokens returned by the fake Plane in the probe tests.
[[allowlists]]
description = "fake access tokens in plane-discord probe tests"
condition = "AND"
paths = ['''apps/plane-discord/test/probe-plane-app\.test\.ts''']
regexes = ['''^(abcdef123456|tok123456789)$''']

# Fake OAuth access token of the fake Plane in the plane-hooks probe test.
[[allowlists]]
description = "fake access token in plane-hooks probe test"
condition = "AND"
paths = ['''apps/plane-hooks/test/probe-app\.test\.ts''']
regexes = ['''^tok-1234567890$''']

# base64 of "not-a-key": a malformed GitHub App key in the plane-hooks config tests.
[[allowlists]]
description = "fake GitHub App key in plane-hooks config tests"
condition = "AND"
paths = ['''apps/plane-hooks/test/service-config\.test\.ts''']
regexes = ['''^bm90LWEta2V5$''']
