name: ci
on:
  pull_request:
  push:
    branches: [main]
jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: alxwlw/stack/.github/actions/setup@v1
      - run: pnpm exec stack check
      - run: pnpm exec moon run :lint :format :typecheck :test
      - name: gitleaks по всей истории
        run: gitleaks git --redact --no-banner .
      - run: proto run actionlint -- -color
