name: plane-discord image
on:
  pull_request:
    paths:
      - 'apps/plane-discord/**'
      - '.github/workflows/plane-discord-image.yml'
  push:
    branches: [main]
    paths:
      - 'apps/plane-discord/**'
      - '.github/workflows/plane-discord-image.yml'
permissions:
  contents: read
  packages: write
env:
  IMAGE: ghcr.io/alxwlw/plane-discord
jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - name: Build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: apps/plane-discord
          platforms: linux/amd64
          load: true
          tags: plane-discord:smoke
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Smoke
        run: |
          set -euo pipefail
          cp apps/plane-discord/tenants.example.json "$RUNNER_TEMP/tenants.json"
          key="$(printf '0a%.0s' $(seq 32))"
          docker run -d --name pd -p 18080:8080 \
            -v "$RUNNER_TEMP/tenants.json:/config/tenants.json:ro" -v pdsmoke:/data \
            -e PLANE_DISCORD_PLANE_URL=https://plane.example.com \
            -e PLANE_DISCORD_PUBLIC_URL=https://plane-discord.example.com \
            -e PLANE_DISCORD_DISCORD_APPLICATION_ID=123456789012345678 \
            -e PLANE_DISCORD_DISCORD_PUBLIC_KEY="$key" \
            -e PLANE_DISCORD_DISCORD_BOT_TOKEN=x \
            -e PLANE_DISCORD_ACME_PLANE_SECRET=x \
            -e PLANE_DISCORD_ACME_WEBHOOK_SECRET=x plane-discord:smoke
          for _ in $(seq 20); do curl -fs localhost:18080/healthz && break; sleep 0.5; done
          curl -fs localhost:18080/healthz | grep -qx ok
          docker exec pd wget -q --spider http://localhost:8080/healthz
          docker logs pd | grep -F '"event":"listening"' | grep -F '"id":"acme"'
          docker exec pd test -f /data/plane-discord.sqlite
          docker rm -f pd
      - name: Log in to ghcr.io
        if: github.event_name == 'push'
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Push
        id: push
        if: github.event_name == 'push'
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: apps/plane-discord
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ github.sha }}
            ${{ env.IMAGE }}:main
          labels: org.opencontainers.image.source=https://github.com/alxwlw/tools
          cache-from: type=gha
      - name: Digest
        if: github.event_name == 'push'
        run: echo "${IMAGE}@${DIGEST}" >> "$GITHUB_STEP_SUMMARY"
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
