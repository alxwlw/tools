$schema: 'https://moonrepo.dev/schemas/project.json'

language: 'typescript'
layer: 'application'

# Канон смотрит в src/ и tests/; здесь каталог тестов — test/, плюс scripts/ и web/.
fileGroups:
  tests:
    - 'test/**/*'
  sources:
    - 'src/**/*'
    - 'scripts/**/*'
    - 'web/**/*'

# The canon lint targets src only; the appended arg adds scripts/.
tasks:
  lint:
    args: 'scripts'
